# On a new tag (vX.Y.Z), build the plugin and publish a GitHub Release with the
# plugin .zip attached as a downloadable asset.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The TextMate grammars (syntax highlighting) live in the sibling vscode-gad
      # repo. Check it out inside the workspace and point the Gradle build at it
      # with -PvscodeDir below; without this the plugin ships with no highlighting.
      - name: Check out vscode-gad grammars
        uses: actions/checkout@v4
        with:
          repository: gad-lang/vscode-gad
          path: .vscode-gad

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Plugin version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # No -PlocalIdePath: the build downloads the configured IntelliJ Platform
      # (IDEA Community) and produces build/distributions/<name>-<version>.zip.
      - name: Build plugin
        run: ./gradlew buildPlugin -PpluginVersion=${{ steps.version.outputs.value }} -PvscodeDir=.vscode-gad --console=plain --no-daemon

      - name: List artifacts
        run: ls -l build/distributions

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/distributions/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
